## Project-wide Gradle settings
# See https://docs.gradle.org/current/userguide/build_environment.html

# JVM args for Gradle daemons
org.gradle.jvmargs=-Xmx1536m

# Enable AndroidX artifacts (required by modern Android libraries)
android.useAndroidX=true
# Jetifier helps migrate older support libraries to AndroidX at build time
android.enableJetifier=true

# Kotlin JVM target (set by Kotlin plugin if needed)
#kotlin.jvm.target=1.8
Gradle wrapper version and configuration
